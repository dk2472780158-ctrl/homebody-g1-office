/homebody_amcl/amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: office_map
    odom_frame_id: hb_amcl_odom
    base_frame_id: hb_amcl_base
    map_topic: map
    scan_topic: scan
    first_map_only: true
    tf_broadcast: true
    transform_tolerance: 0.3
    set_initial_pose: false
    always_reset_initial_pose: true
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    min_particles: 500
    max_particles: 2000
    pf_err: 0.02
    pf_z: 0.99
    resample_interval: 1
    update_min_a: 0.0087
    update_min_d: 0.005
    # Global recovery is managed by independently verified 3-D seeds.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    laser_model_type: likelihood_field_prob
    max_beams: 180
    laser_min_range: 0.43
    laser_max_range: 12.0
    laser_likelihood_max_dist: 1.0
    sigma_hit: 0.15
    z_hit: 0.9
    z_rand: 0.1
    do_beamskip: true
    beam_skip_distance: 0.3
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    save_pose_rate: 0.5
