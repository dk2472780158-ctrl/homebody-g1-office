name: Office checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pillow websocket-client fastapi httpx matplotlib
      - run: python -B scripts/check-release.py
      - run: python -B scripts/test-office.py
